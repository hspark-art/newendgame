; 끝장전 CG — PC 실행용 PHP 설정 (시작.bat 이 -c 로 지정합니다)
; extension_dir 은 시작.bat 이 프로그램 폴더 기준 절대경로로 넘깁니다.
extension=pdo_sqlite
extension=mbstring
date.timezone = Asia/Seoul
default_charset = "UTF-8"
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 256M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 4M
